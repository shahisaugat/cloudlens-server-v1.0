spring:
  datasource:
    url: ${CLOUDLENS_DB_URL:jdbc:postgresql://localhost:5432/cloudlens}
    username: ${CLOUDLENS_DB_USERNAME:postgres}
    password: ${CLOUDLENS_DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  application:
    name: cloudlens

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user
              - repo
              - workflow

slack:
  client-id: ${SLACK_CLIENT_ID}
  client-secret: ${SLACK_CLIENT_SECRET}
  signing-secret: ${SLACK_SIGNING_SECRET}
  redirect-uri: http://localhost:8080/api/v1/slack/callback

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG