name: CloudLens CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudlens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        env:
          CLOUDLENS_DB_URL: jdbc:postgresql://localhost:5432/cloudlens_test
          CLOUDLENS_DB_USERNAME: postgres
          CLOUDLENS_DB_PASSWORD: password
          GITHUB_CLIENT_ID: dummy_id
          GITHUB_CLIENT_SECRET: dummy_secret
          SLACK_CLIENT_ID: dummy_id
          SLACK_CLIENT_SECRET: dummy_secret
          SLACK_SIGNING_SECRET: dummy_secret
          JWT_SECRET: dummy_jwt
        run: ./mvnw clean package

      - name: Build Docker Image
        run: docker build -t cloudlens-server .
